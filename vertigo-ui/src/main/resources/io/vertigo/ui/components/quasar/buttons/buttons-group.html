<!--/* xs, sm, md, lg, xl : number of buttons shown inline by screen size (99 by default, a missing size follows the next one).
     For a size of threshold N : the buttons of rank < N inline, the others in the "more" menu, the "more" button only if there are more than N buttons.
     The server leaves out what is never visible ; the screen size is followed on the client side by the Quasar classes gt-* / lt-*. */-->
<th:block th:fragment="buttons-group(moreLabel, color, textColor, xs, sm, md, lg, xl, contentTags, btn_attrs, other_attrs)"
	  th:with="buttonsCount=${contentTags.size()},xl=${xl?:99},lg=${lg?:xl},md=${md?:lg},sm=${sm?:md},xs=${xs?:sm}">
	
	<th:block th:each="contentItem,iter:${contentTags}">
		<vu:content-item th:if="${iter.index<xl}"
		th:class="${iter.index>=lg?'gt-lg':iter.index>=md?'gt-md':iter.index>=sm?'gt-sm':iter.index>=xs?'gt-xs':''}"/>		
	</th:block>
	<th:block th:if="${buttonsCount>xs}">
		<q-btn round size="lg" th:color="${color?:'primary'}" th:text-color="${textColor?:''}" icon="more_horiz" direction="down" th:title="${moreLabel?:'__#{buttons.buttons-group.moreActions}__'}" class="on-left"
				th:classappend="${buttonsCount>xl?'':buttonsCount>lg?'lt-xl':buttonsCount>md?'lt-lg':buttonsCount>sm?'lt-md':'lt-sm'}" th:attr="__${btn_attrs}__">
			<span class="sr-only" vu:text="${moreLabel?:'__#{buttons.buttons-group.moreActions}__'}"></span>
			<q-menu auto-close class="more-elements">
				<div class="column no-wrap q-pa-xs">
					<vu:content-item th:each="contentItem,iter:${contentTags}" th:if="${iter.index>=xs}"
						th:class="'q-ma-none ' + ${iter.index>=xl?'':iter.index>=lg?'lt-xl':iter.index>=md?'lt-lg':iter.index>=sm?'lt-md':'lt-sm'}"
					    align="left" size="md" :round="false" color="primary" label="${contentItem.getAttribute('title')}">
					</vu:content-item >
				</div>
			</q-menu>
		</q-btn>
	</th:block>
</th:block>
